# Spring Boot defaults. Production values come from an external
# application.properties file or TEDDY_* environment variables.
name=teddy
server.port=${TEDDY_SERVER_PORT:18081}
logging.level.root=INFO
logging.level.c.x.t.mapper=DEBUG

# File upload limits
spring.servlet.multipart.maxFileSize=300MB
spring.servlet.multipart.maxRequestSize=300MB

# Static resources. Every request revalidates with the server (unchanged
# content still returns 304), so a published page is never shadowed by a
# stale cached copy. The pages have no fingerprinted asset names, so a long
# max-age would be wrong here.
spring.resources.cache.cachecontrol.no-cache=true

# MySQL. Empty defaults deliberately make startup fail until production
# credentials are supplied outside the release package.
spring.datasource.url=${TEDDY_DATASOURCE_URL:}
spring.datasource.username=${TEDDY_DATASOURCE_USERNAME:}
spring.datasource.password=${TEDDY_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
