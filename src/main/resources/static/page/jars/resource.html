<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teddy</title>
    <!-- bootstrap 3.0.2 -->
    <link href="../../css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="../../css/teddy.css" rel="stylesheet" type="text/css" />
    <!-- font Awesome -->
    <link href="../../css/font-awesome.min.css" rel="stylesheet" type="text/css" />
    <!-- jQuery 2.0.2 -->
    <script src="../../js/jquery.min.js" type="text/javascript"></script>
    <!-- jQuery UI 1.10.3 -->
    <script src="../../js/jquery-ui-1.10.3.min.js" type="text/javascript"></script>
    <!-- Bootstrap -->
    <script src="../../js/bootstrap.min.js" type="text/javascript"></script>
    <script src="../../js/checkToken-v2.js" type="text/javascript"></script>

    <link rel="stylesheet" href="../../js/uploader/css/dropify.min.css">
    <script src="../../js/uploader/js/dropify.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-inverse" role="navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="../taskm/monitor.html">Teddy<span class="navbar-version" id="teddy-version"></span></a>
            </div>
            <div>
                <ul class="nav navbar-nav">
                    <li><a href="../taskm/monitor.html">任务监控</a></li>
                    <li><a href="../tasks/submit.html">任务配置</a></li>
                    <li class="active"><a href="#">资源管理</a></li>
                    <li><a href="../system/config.html">系统配置</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="alertDiv" style="display:none; margin:20px 20px 0;">
        <div class="alert" id="alertBox" style="margin-bottom:0;">
            <p id="alertP" style="margin:0;"></p>
        </div>
    </div>

    <div class="panel panel-info" style="margin:20px;">
        <div class="panel-heading">
            <h3 class="panel-title">资源管理</h3>
        </div>
        <div class="panel-body">
            <div class="row" style="margin:20px;">
                <input type="file" id="inputfile" class="dropify" data-default-file="" />
            </div>
            <div class="row" style="margin:20px 20px 0;">
                <div class="col-md-6" style="padding-left:0;">
                    <label for="uploadName" style="font-weight:normal;">保存为</label>
                    <input type="text" id="uploadName" class="form-control" maxlength="120"
                           placeholder="留空则使用原文件名，例如 Streaming.jar" />
                    <p class="text-muted" style="margin:6px 0 0;">
                        文件名就是任务引用 JAR 的键，上传后改名会连带影响任务配置，建议在这里一次定好。
                    </p>
                </div>
            </div>
            <div class="row" style="margin:20px;">
                <button id="uploadFileBtn" class="btn btn-default">提交</button>
            </div>
        </div>
    </div>

    <div class="panel panel-info" style="margin:20px;">
        <div class="panel-heading">
            <h3 class="panel-title">资源列表</h3>
        </div>
        <div class="panel-body">
            <div class="row" style="margin:20px 20px 0;">
                <p class="text-muted" id="resourceDirectory" style="margin:0;"></p>
            </div>
            <div class="row" style="margin:20px;">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>名称</th>
                        <th>大小</th>
                        <th>修改时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="c3_body">

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../../js/teddy-version.js" type="text/javascript"></script>
    <script src="resource.js" type="text/javascript"></script>
</body>
</html>
