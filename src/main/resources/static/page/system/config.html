<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teddy</title>
    <!-- bootstrap 3.0.2 -->
    <link href="../../css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <!-- jQuery 2.0.2 -->
    <script src="../../js/jquery.min.js" type="text/javascript"></script>
    <!-- jQuery UI 1.10.3 -->
    <script src="../../js/jquery-ui-1.10.3.min.js" type="text/javascript"></script>
    <!-- Bootstrap -->
    <script src="../../js/bootstrap.min.js" type="text/javascript"></script>

    <script src="../../js/checkToken-v2.js" type="text/javascript"></script>
</head>
<body>
    <nav class="navbar navbar-inverse" role="navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="../taskm/monitor.html">Teddy</a>
            </div>
            <div>
                <ul class="nav navbar-nav">
                    <li><a href="../taskm/monitor.html">任务监控</a></li>
                    <li><a href="../tasks/submit.html">任务配置</a></li>
                    <li><a href="../jars/resource.html">资源管理</a></li>
                    <li class="active"><a href="#">系统配置</a></li>
                </ul>
            </div>
            <p class="navbar-text navbar-right" id="teddy-version"></p>
        </div>
    </nav>

    <div class="panel panel-info" style="margin:20px;">
        <div class="panel-heading">
            <h3 class="panel-title">通知配置</h3>
        </div>
        <div class="panel-body">
            <p class="text-muted">
                这里维护可复用的企业微信机器人地址。标记为"默认"的那条，会在任务配置页通过"填入默认通知"一键带入。
            </p>
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>名称</th>
                    <th>机器人地址</th>
                    <th>默认</th>
                    <th>操作</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="c4_body">

                </tbody>
            </table>
        </div>
    </div>

    <div class="panel panel-info" style="margin:20px;">
        <div class="panel-heading">
            <h3 class="panel-title" id="c4_form_title">新增通知配置</h3>
        </div>
        <div class="panel-body">
            <form class="form-horizontal" role="form">
                <div class="form-group">
                    <label class="col-sm-2 control-label">名称</label>
                    <div class="col-sm-10">
                        <input class="form-control" id="c4NameInput" type="text" placeholder="例如：实时采集告警群">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">机器人地址</label>
                    <div class="col-sm-10">
                        <input class="form-control" id="c4WebhookInput" type="text"
                               placeholder="企业微信机器人 Webhook 地址">
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label">设为默认</label>
                    <div class="col-sm-10">
                        <div class="checkbox">
                            <label>
                                <input type="checkbox" id="c4IsDefaultInput"> 新建任务时作为默认通知
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-sm-2 control-label"> </label>
                    <div class="col-sm-10">
                        <button type="button" id="c4SaveBtn" class="btn btn-default">保存</button>
                        <button type="button" id="c4ResetBtn" class="btn btn-default">重置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/teddy-version.js" type="text/javascript"></script>
    <script src="config.js" type="text/javascript"></script>
</body>
</html>
